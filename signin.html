<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMPACT Lab Sign-in</title>
<style>
  :root { --bg: #f4f4f4; --card: #fff; --fg: #141414; --muted: #666; --red: #d71920; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161616; --card: #222; --fg: #eee; --muted: #aaa; } }
  :root[data-theme="dark"] { --bg: #161616; --card: #222; --fg: #eee; --muted: #aaa; }
  body { margin: 0; padding: 16px; font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--fg); }
  .box { max-width: 420px; margin: 30px auto; background: var(--card); border-radius: 16px; padding: 24px; box-shadow: 0 4px 16px rgba(0, 0, 0, .08); text-align: center; }
  .logo { display: inline-block; background: var(--red); color: #fff; border-radius: 10px; padding: 2px 10px; font-weight: 800; }
  .btn { display: inline-block; background: var(--red); color: #fff; text-decoration: none; font-weight: 700; border-radius: 12px; padding: 14px 22px; font-size: 17px; margin-top: 10px; }
  #gbtn { display: flex; justify-content: center; margin: 18px 0 6px; min-height: 44px; }
  .muted { color: var(--muted); font-size: 13px; }
  .err { color: #b42318; }
</style>
</head>
<body>
<div class="box">
  <h2><span class="logo">IL</span> IMPACT Lab</h2>
  <p id="msg">Choose your Google account</p>
  <div id="gbtn"></div>
  <p><a id="go" class="btn" href="#" style="display:none"></a></p>
  <p class="muted" id="who"></p>
  <p class="muted">Only your name and e-mail address are shared with the IMPACT Lab App. Several Google accounts in this browser are fine – pick the one you use for the lab.</p>
</div>
<script>
/* IMPACT Lab – Google sign-in on GitHub Pages (Google's own "Sign in with Google" with its account chooser). The Google ID token
 * goes to the lab server (action googleIdPass), which checks it and gives a one-time code. ?app=1 (from the Android app): a
 * button back to the app with the code; otherwise on to the site (index.html?gcode=…). */
var CLIENT_ID = "202741566944-vacciiccunqjn4bdjb63k6pa0mn9039j.apps.googleusercontent.com";
var SERVER = "https://script.google.com/macros/s/AKfycbyuN_AzGUko40VRqM6zlv_yosUjaoL-821UcLuxYS6QdeqGbSZPrpotWMUW4HSn6QviOQ/exec";
var q = new URLSearchParams(location.search), fromApp = q.get("app") === "1", mode = q.get("mode") === "signup" ? "signup" : "login";
function show(t, err) { var m = document.getElementById("msg"); m.textContent = t; m.className = err ? "err" : ""; }
function onCredential(resp) {
  show("Signing you in…");
  fetch(SERVER, { method: "POST", body: JSON.stringify({ action: "googleIdPass", args: { id_token: resp.credential, mode: mode } }), headers: { "Content-Type": "text/plain;charset=utf-8" }, redirect: "follow" })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok) { show(res.error || "Sign-in failed", true); return; }
      document.getElementById("who").textContent = "Google account: " + res.data.email;
      document.getElementById("gbtn").style.display = "none";
      var go = document.getElementById("go"), code = encodeURIComponent(res.data.code);
      go.style.display = "inline-block";
      if (fromApp) {
        show("Signed in with Google ✓");
        go.textContent = "Return to the IMPACT Lab app →";
        go.href = "intent://gsign?code=" + code + "#Intent;scheme=impactlab;package=in.ac.iitr.impactlab;end";
      } else {
        show("Signed in with Google ✓ – opening the app…");
        go.textContent = "Continue to the IMPACT Lab App →";
        go.href = "./?gcode=" + code;
        location.href = go.href;
      }
    })
    .catch(function (e) { show("Could not reach the lab server: " + e.message, true); });
}
function start() {
  if (!window.google || !google.accounts) { show("Google sign-in could not load – check the internet and reload.", true); return; }
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: false, itp_support: true, use_fedcm_for_prompt: true });
  google.accounts.id.renderButton(document.getElementById("gbtn"), { theme: "filled_blue", size: "large", shape: "pill", text: mode === "signup" ? "signup_with" : "signin_with", width: 280 });
  google.accounts.id.prompt();
}
</script>
<script src="https://accounts.google.com/gsi/client" async onload="start()"></script>
</body>
</html>
